name: release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
            bin: semanticfs

          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
            bin: semanticfs

          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
            bin: semanticfs

          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
            bin: semanticfs.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfuse3-dev protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release -p semanticfs-cli --target ${{ matrix.target }}

      - name: Package artifact (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARTIFACT="semanticfs-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${ARTIFACT}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${ARTIFACT}/"
          cp scripts/semanticfs_mcp_stdio.py "dist/${ARTIFACT}/"
          cp config/semanticfs.sample.toml "dist/${ARTIFACT}/"
          cp scripts/install.sh "dist/${ARTIFACT}/" 2>/dev/null || true
          tar -czf "dist/${ARTIFACT}.tar.gz" -C dist "${ARTIFACT}"
          echo "ARTIFACT_PATH=dist/${ARTIFACT}.tar.gz" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${ARTIFACT}.tar.gz" >> "$GITHUB_ENV"

      - name: Package artifact (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $Version = "$env:GITHUB_REF_NAME"
          $Artifact = "semanticfs-$Version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$Artifact" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/$Artifact/"
          Copy-Item "scripts/semanticfs_mcp_stdio.py" "dist/$Artifact/"
          Copy-Item "config/semanticfs.sample.toml" "dist/$Artifact/"
          Compress-Archive -Path "dist/$Artifact" -DestinationPath "dist/$Artifact.zip"
          echo "ARTIFACT_PATH=dist/$Artifact.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "ARTIFACT_NAME=$Artifact.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
