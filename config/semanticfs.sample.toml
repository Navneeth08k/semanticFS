# SemanticFS sample configuration.
# Copy to config/local.toml (or run: semanticfs --config semanticfs.toml init)
# and fill in your repo_root path.

[workspace]
# Absolute path to the repository / project root to index.
repo_root = "/abs/repo"
# FUSE virtual filesystem mount point (Linux only).
# On macOS / Windows this is parsed but the mount is not created — leave as-is.
mount_point = "/mnt/ai"

# Optional: add [[workspace.domains]] sections for multi-repo workspaces.
# Each domain can have its own trust, watch priority, and file limits.
# See config/profiles/multi-root-dev-box.sample.toml for examples.

[filter]
# "repo_first" = index files under repo_root that match allow_roots.
# "multi_root"  = use per-domain allow_roots (auto-set for multi-root configs).
mode = "repo_first"

# Which subdirectories to include (glob patterns relative to repo_root).
# Tip: list only the directories that contain source code / docs — not all of /.
allow_roots = ["src/**", "lib/**", "apps/**", "services/**", "docs/**", "configs/**"]

# Patterns to exclude. Add your build artifacts and large generated dirs here.
deny_globs = [
  "**/.git/**", "**/node_modules/**", "**/target/**", "**/dist/**", "**/build/**",
  "**/.next/**", "**/.nuxt/**", "**/.svelte-kit/**", "**/.turbo/**", "**/.dart_tool/**",
  "**/.venv/**", "**/venv/**", "**/__pycache__/**", "**/.cache/**", "**/.idea/**",
  "**/coverage/**", "**/out/**",
  "**/.DS_Store", "**/Library/**", "**/Trash/**", "**/*.jpg", "**/*.png", "**/*.mp4"
]

# Skip files larger than this (MB). Prevents indexing large generated/binary files.
max_file_mb = 10

[index]
# Milliseconds to wait after a filesystem event before re-indexing.
# Higher = fewer spurious re-indexes during rapid edits (e.g. save storms).
debounce_ms = 500

# "two_phase": write staging version first, then atomically promote to active.
# This keeps searches consistent while an index rebuild is in progress.
publish_mode = "two_phase"

# Maximum lines per text chunk. Smaller = more precise line ranges in results.
chunk_max_lines = 120

# Lines of overlap between adjacent chunks (improves recall at chunk boundaries).
chunk_overlap_lines = 20

# If more than this many files change at once, skip per-file prioritization.
bulk_event_threshold = 80

# Number of frequently-accessed files to prioritize in incremental re-indexes.
hotset_max_paths = 32

# How many pending paths to log when the index queue is non-empty.
pending_path_report_limit = 20

[embedding]
# Model name (display/selection hint only). Set runtime below to actually use it.
model = "bge-small-en-v1.5"

# "hash"  = fast deterministic hash embedding, no model download required.
#            Gives 100% recall on symbol/keyword queries.
# "onnx"  = real transformer embeddings via Python sidecar (higher quality for
#            natural language queries). Run: semanticfs model setup
runtime = "hash"

# Quantization hint passed to the sidecar (onnx backend only).
quantization = "int8"

# Embedding vector dimension. Must match the model's output size.
# bge-small-en-v1.5 outputs 384 dimensions.
dimension = 384

# Maximum texts to embed in a single sidecar call (onnx backend only).
batch_size = 64

[retrieval]
# v1.1 locked profile (recall=1.000, MRR=1.000 on all golden suites):
# vector backend: lancedb (default unless SEMANTICFS_VECTOR_BACKEND=sqlite)
rrf_mode = "plain"

# Reciprocal Rank Fusion k parameter. Higher k = smoother rank differences.
rrf_k = 60

# Candidates to pull from each retrieval pipeline before RRF fusion.
topn_symbol = 10   # exact/prefix symbol matches
topn_bm25   = 20   # BM25 full-text search
topn_vector = 20   # vector similarity search

# Final number of results returned to the agent after fusion + re-ranking.
topn_final = 5

# Multiplier for exact symbol name matches (e.g. function names, class names).
symbol_exact_boost = 2.0
# Multiplier for prefix symbol matches (e.g. "get" matching "getUser").
symbol_prefix_boost = 1.2

# If true, allow serving results from a stale (non-active) snapshot.
allow_stale = false

# Path-based score adjustments. Code paths get a small boost; assets a penalty.
code_path_boost    = 1.15
docs_path_penalty  = 0.85
test_path_penalty  = 0.95
asset_path_penalty = 0.45

# Recency boost: recently-modified files score slightly higher.
recency_half_life_hours = 24.0   # boost half-life in hours
recency_min_boost = 0.85         # minimum multiplier for old files
recency_max_boost = 1.20         # maximum multiplier for very recent files

[fuse_cache]
# Maximum virtual inodes to keep in the LRU inode cache.
max_virtual_inodes = 50000

# Maximum total content data (MB) to cache in memory.
max_cached_mb = 256

# TTL for FUSE cache entries (ms). Lower = fresher, more syscalls.
entry_ttl_ms = 300
attr_ttl_ms  = 300

[fuse_session]
# "pinned" = fix the snapshot until explicitly refreshed.
# Prevents mid-task drift if a rebuild happens while an agent is working.
mode = "pinned"

# Maximum number of snapshot entries tracked per session.
max_entries = 512

[map]
# How to generate directory summaries.
# "deterministic_precompute" = fast, no LLM needed (metadata + symbol extraction).
base_summary_mode = "deterministic_precompute"

# "async_optional" = spawn LLM enrichment after each build (non-blocking, best-effort).
# "disabled"       = skip LLM enrichment entirely.
llm_enrichment = "async_optional"

# How long (seconds) to cache generated directory maps before regenerating.
cache_ttl_sec = 3600

[policy]
# SemanticFS only reads indexed files — this is always enforced.
read_only = true

# Redact common secret patterns (API keys, tokens) from search results.
deny_secret_paths = true
search_result_redaction = true

# Trust labels recognised by the policy engine.
# "trusted" files get higher credibility; "untrusted" paths are still indexed.
trust_labels = ["trusted", "untrusted"]

[observability]
# Address for the MCP HTTP server and Prometheus metrics endpoint.
# Change port if 9464 conflicts with another process.
metrics_bind = "127.0.0.1:9464"

# Address for health / readiness HTTP endpoints (/health/live, /health/ready).
health_bind = "127.0.0.1:9465"

# Log verbosity: "error", "warn", "info", "debug", or "trace".
log_level = "info"

[mcp]
# Enable MCP tool endpoints (/tools/search_codebase, /tools/get_directory_map).
enabled = true

# "minimal" = search + map tools only (recommended for most agents).
# "full"    = also exposes /resources/* and /prompts/* endpoints.
mode = "minimal"
